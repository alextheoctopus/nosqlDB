services:
  app:
    build: .
    env_file:
      - .env.local
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      cassandra-dc1-node1:
        condition: service_healthy
      redis:
        condition: service_started
      mongos:
        condition: service_started
      mongo-setup:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  configsvr1:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27019", "--bind_ip_all"]
    ports:
      - "27019:27019"
    volumes:
      - configsvr1_data:/data/db

  configsvr2:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27020", "--bind_ip_all"]
    ports:
      - "27020:27020"
    volumes:
      - configsvr2_data:/data/db

  configsvr3:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27021", "--bind_ip_all"]
    ports:
      - "27021:27021"
    volumes:
      - configsvr3_data:/data/db

  shard1a:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27101", "--bind_ip_all"]
    ports:
      - "27101:27101"
    volumes:
      - shard1a_data:/data/db

  shard1b:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27102", "--bind_ip_all"]
    ports:
      - "27102:27102"
    volumes:
      - shard1b_data:/data/db

  shard1c:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27103", "--bind_ip_all"]
    ports:
      - "27103:27103"
    volumes:
      - shard1c_data:/data/db

  shard2a:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27201", "--bind_ip_all"]
    ports:
      - "27201:27201"
    volumes:
      - shard2a_data:/data/db

  shard2b:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27202", "--bind_ip_all"]
    ports:
      - "27202:27202"
    volumes:
      - shard2b_data:/data/db

  shard2c:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27203", "--bind_ip_all"]
    ports:
      - "27203:27203"
    volumes:
      - shard2c_data:/data/db

  mongos:
    image: mongo:7.0
    command: ["mongos", "--configdb", "cfgRS/configsvr1:27019,configsvr2:27020,configsvr3:27021", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGODB_PORT}:27017"
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
      - shard1a
      - shard1b
      - shard1c
      - shard2a
      - shard2b
      - shard2c

  mongo-setup:
    image: mongo:7.0
    env_file:
      - .env.local
    depends_on:
      - mongos
      - configsvr1
      - configsvr2
      - configsvr3
      - shard1a
      - shard1b
      - shard1c
      - shard2a
      - shard2b
      - shard2c
    volumes:
      - ./mongo-cluster-init.sh:/scripts/mongo-cluster-init.sh:ro
    entrypoint: [ "bash", "/scripts/mongo-cluster-init.sh" ]
    restart: "no"

  cassandra-dc1-node1:
    image: cassandra:latest
    container_name: cassandra-dc1-node1
    environment:
      - CASSANDRA_CLUSTER_NAME=IoTCLuster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_SEEDS=cassandra-dc1-node1
    mem_limit: 4g
    mem_reservation: 3g
    ports:
      - "${CASSANDRA_PORT}:${CASSANDRA_PORT}"
    volumes:
      - ./volume/dc1-node1:/var/lib/cassandra/data
    networks:
      - default
      - cassandra-net
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
networks:
  cassandra-net:
    driver: bridge

volumes:
  configsvr1_data:
  configsvr2_data:
  configsvr3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data: