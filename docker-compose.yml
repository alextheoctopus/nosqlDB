services:
  app:
    build: .
    env_file:
      - .env.local
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - redis
      - mongodb

  redis:
    image: redis:7-alpine
    ports:
       - "${REDIS_PORT}:${REDIS_PORT}"

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    command: ["--port", "${MONGODB_PORT}"]
